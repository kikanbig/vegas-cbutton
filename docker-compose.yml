services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vegas_cbutton
      POSTGRES_USER: vegas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Minsk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vegas -d vegas_cbutton"]
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
      - "5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://vegas:${POSTGRES_PASSWORD}@postgres:5432/vegas_cbutton
      TZ: Europe/Minsk
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
